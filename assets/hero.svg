<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Hokkaido</title>
  <desc id="desc">后端架构 · 系统底层 · AI Agent · 数据建模</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Menlo, monospace; }
    </style>
  </defs>

  <!-- Canvas Container -->
  <rect x="1" y="1" width="1198" height="178" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Top Metadata Header Strip -->
  <g class="mono" font-size="11" letter-spacing="1">
    <rect x="44" y="20" width="76" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="82" y="34" text-anchor="middle" fill="#58a6ff" font-weight="600">PROFILE</text>
    <text x="134" y="34" fill="#8b949e">HOKKAIDO</text>
    <text x="1156" y="34" text-anchor="end" fill="#6e7681">NANJING, CN</text>
  </g>
  <line x1="44" y1="48" x2="1156" y2="48" stroke="#21262d" stroke-width="1"/>

  <!-- Main Identity Block -->
  <g transform="translate(44, 66)">
    <!-- Name and Subtitle on same baseline -->
    <text x="0" y="36" class="sans" fill="#f0f6fc" font-size="38" font-weight="700" letter-spacing="-1">Hokkaido</text>
    <text x="200" y="33" class="sans" fill="#8b949e" font-size="15">
      后端架构 <tspan fill="#30363d">|</tspan> 系统底层 <tspan fill="#30363d">|</tspan> AI Agent <tspan fill="#30363d">|</tspan> 数据建模
    </text>

    <!-- Clean Tech Pills -->
    <g transform="translate(0, 58)" class="mono" font-size="11">
      <rect x="0" y="0" width="78" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="39" y="16" text-anchor="middle" fill="#c9d1d9">C++17</text>

      <rect x="86" y="0" width="114" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="143" y="16" text-anchor="middle" fill="#c9d1d9">Linux / epoll</text>

      <rect x="208" y="0" width="78" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="247" y="16" text-anchor="middle" fill="#c9d1d9">Python</text>

      <rect x="294" y="0" width="98" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="343" y="16" text-anchor="middle" fill="#c9d1d9">LangGraph</text>

      <rect x="400" y="0" width="90" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="445" y="16" text-anchor="middle" fill="#c9d1d9">GraphRAG</text>

      <rect x="498" y="0" width="90" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="543" y="16" text-anchor="middle" fill="#c9d1d9">NetworkX</text>

      <rect x="596" y="0" width="76" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="634" y="16" text-anchor="middle" fill="#c9d1d9">MySQL</text>
    </g>
  </g>
</svg>