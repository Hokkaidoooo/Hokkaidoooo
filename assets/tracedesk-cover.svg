      <text x="148" y="27" text-anchor="middle" fill="#71d9d9" class="mono" font-size="13">Snapshot &amp; Evidence Binding</text>
    </g>
  </g>

  <g transform="translate(428 250)">
    <rect width="344" height="260" rx="12" fill="#16252c" stroke="#314852"/>
    <text x="24" y="42" class="mono" fill="#71d9d9" font-size="14">02 / RESEARCH</text>
    <text x="24" y="88" fill="#f0f5f5" font-size="24" font-weight="600">协作研究工作流</text>
