<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">知乎专栏离线导出</title>
  <desc id="desc">将当前账号有权阅读的知乎专栏导出为 Markdown、离线 HTML 和本地图片的 Chrome 扩展</desc>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <style>
      text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
      .mono{font-family:"Cascadia Code",Consolas,monospace}
    </style>
  </defs>
  <rect width="1200" height="640" rx="20" fill="#101b20"/>
  <rect width="1200" height="640" rx="20" fill="url(#g)"/>
  <text x="56" y="65" fill="#4da6ff" class="mono" font-size="15" letter-spacing="3">CHROME EXTENSION / MANIFEST V3 / TOOL</text>
  <text x="54" y="143" fill="#f1f3e9" font-size="44" font-weight="700">知乎专栏离线导出<tspan fill="#4da6ff">。</tspan></text>
  <text x="56" y="193" fill="#b2c3c8" font-size="22">完整目录读取 → Markdown / 离线 HTML → 本地图片归档与断点补读</text>

  <g transform="translate(56 250)">
    <rect width="344" height="260" rx="12" fill="#16222c" stroke="#2d3f50"/>
    <text x="24" y="42" class="mono" fill="#4da6ff" font-size="14">01 / CRAWL</text>
    <text x="24" y="88" fill="#f0f5f5" font-size="24" font-weight="600">目录与正文读取</text>
    <text x="24" y="122" fill="#8ea4a9" font-size="15">自动分页读取标准专栏全量目录</text>
    <text x="24" y="152" fill="#8ea4a9" font-size="14">登录态接口优先 · 页面模式降级兜底</text>
    <g transform="translate(24 186)">
      <rect width="296" height="44" rx="6" fill="#1c2f3e"/>
      <text x="148" y="27" text-anchor="middle" fill="#4da6ff" class="mono" font-size="13">Adaptive Article Fetching</text>
    </g>
  </g>

  <g transform="translate(428 250)">
    <rect width="344" height="260" rx="12" fill="#16222c" stroke="#2d3f50"/>
    <text x="24" y="42" class="mono" fill="#4da6ff" font-size="14">02 / ARCHIVE</text>
    <text x="24" y="88" fill="#f0f5f5" font-size="24" font-weight="600">离线多格式打包</text>
    <text x="24" y="122" fill="#8ea4a9" font-size="15">Markdown + 独立离线 HTML 目录</text>
    <text x="24" y="152" fill="#8ea4a9" font-size="14">正文图片本地化 · 保持目录排版层级</text>
    <g transform="translate(24 186)">
      <rect width="296" height="44" rx="6" fill="#1c2f3e"/>
      <text x="148" y="27" text-anchor="middle" fill="#4da6ff" class="mono" font-size="13">Offline Assets &amp; Markdown</text>
    </g>
  </g>

  <g transform="translate(800 250)">
    <rect width="344" height="260" rx="12" fill="#16222c" stroke="#2d3f50"/>
    <text x="24" y="42" class="mono" fill="#4da6ff" font-size="14">03 / RESILIENCE</text>
    <text x="24" y="88" fill="#f0f5f5" font-size="24" font-weight="600">断点重试与安全</text>
    <text x="24" y="122" fill="#8ea4a9" font-size="15">未完成章节清单 · 单独补读断点重试</text>
    <text x="24" y="152" fill="#8ea4a9" font-size="14">不申请 Cookie 权限 · 零鉴权信息外泄</text>
    <g transform="translate(24 186)">
      <rect width="296" height="44" rx="6" fill="#1c2f3e"/>
      <text x="148" y="27" text-anchor="middle" fill="#4da6ff" class="mono" font-size="13">Zero-Cookie / Retry Resilience</text>
    </g>
  </g>

  <text x="56" y="595" fill="#91a6ae" font-size="14">TypeScript / Manifest V3 · 沿用浏览器已有登录态，用于合法的个人离线备份与学习。</text>
</svg>